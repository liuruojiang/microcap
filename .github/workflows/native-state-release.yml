name: Assemble verified native state release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact base and delta
        run: |
          gh release download top100-native-daily-20261102 --repo liuruojiang/microcap --pattern microcap-native-whole-delivery-20261030.zip
          gh release download top100-tencent-daily-20261102 --repo liuruojiang/microcap --pattern scoped-state-delta.zip
      - name: Reconstruct and verify identical bundle
        shell: python
        run: |
          import hashlib,json,zipfile
          from pathlib import Path
          old=Path('microcap-native-whole-delivery-20261030.zip').read_bytes()
          delta=Path('scoped-state-delta.zip').read_bytes()
          assert hashlib.sha256(old).hexdigest()=='2c673040c8d919476f8896e5596b7a693db6443304d4ad9e3f50925383c8a140'
          assert hashlib.sha256(delta).hexdigest()=='f4117c11aa0d555cfbc7c3c2924bbcbbda86f319cc82611e77f2185589d2fb2f'
          with zipfile.ZipFile('scoped-state-delta.zip') as z:
              r=json.loads(z.read('recipe.json'));literal=z.read('literals.bin')
          result=bytearray()
          for kind,start,size in r['ops']:
              assert kind in ('copy','literal') and start>=0 and size>=0
              source=old if kind=='copy' else literal
              assert start+size<=len(source)
              result.extend(source[start:start+size])
          assert len(result)==605642042
          assert hashlib.sha256(result).hexdigest()=='9338d5536584b131d0ee0a78fcf7a604f85970c21c30a33b77c35be6902c0864'
          Path('microcap-tencent-whole-delivery-20261102.zip').write_bytes(result)
      - name: Upload exact bundle and publish release
        run: |
          gh release upload top100-tencent-daily-20261102 microcap-tencent-whole-delivery-20261102.zip --repo liuruojiang/microcap
          gh release edit top100-tencent-daily-20261102 --repo liuruojiang/microcap --draft=false
