name: Assemble verified native state release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact base and delta
        run: |
          gh release download top100-tencent-daily-20261102 --repo liuruojiang/microcap --pattern microcap-tencent-whole-delivery-20261102.zip
          gh release download top100-audit-fixes-20261103 --repo liuruojiang/microcap --pattern audit-fixes-state-delta.zip
      - name: Reconstruct and verify identical bundle
        shell: python
        run: |
          import hashlib,json,zipfile
          from pathlib import Path
          old=Path('microcap-tencent-whole-delivery-20261102.zip').read_bytes()
          delta=Path('audit-fixes-state-delta.zip').read_bytes()
          assert hashlib.sha256(old).hexdigest()=='9338d5536584b131d0ee0a78fcf7a604f85970c21c30a33b77c35be6902c0864'
          assert hashlib.sha256(delta).hexdigest()=='40b386136f0973cebe77e8de1294cb56f938b0486db6f702d3004329b614c033'
          with zipfile.ZipFile('audit-fixes-state-delta.zip') as z:
              r=json.loads(z.read('recipe.json'));literal=z.read('literals.bin')
          result=bytearray()
          for kind,start,size in r['ops']:
              assert kind in ('copy','literal') and start>=0 and size>=0
              source=old if kind=='copy' else literal
              assert start+size<=len(source)
              result.extend(source[start:start+size])
          assert len(result)==605202401
          assert hashlib.sha256(result).hexdigest()=='99007407df303991522d0f499121f99ddbf8f79cbae37b1d712e753b0aebfc93'
          Path('microcap-audit-fixed-whole-delivery-20261102.zip').write_bytes(result)
      - name: Upload exact bundle and publish release
        run: |
          gh release upload top100-audit-fixes-20261103 microcap-audit-fixed-whole-delivery-20261102.zip --repo liuruojiang/microcap
          gh release edit top100-audit-fixes-20261103 --repo liuruojiang/microcap --draft=false
