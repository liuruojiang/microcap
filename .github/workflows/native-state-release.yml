name: Source-only CNInfo share handoff
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  share-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          path: operator
          sparse-checkout: research_reports/20261103_share_source_handoff
      - uses: actions/checkout@v6
        with:
          ref: b5ac304790aa8644407de4c0712920f2c8ea2fb0
          path: source
          sparse-checkout: |
            scripts/share_change_source.py
            scripts/stock_return_basis_store.py
            scripts/stock_return_basis.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the existing pinned public source dependencies
        run: python -m pip install numpy 'pandas<3' requests 'akshare==1.18.46'
      - name: Fetch exact public source input and verify adapter
        run: |
          mkdir -p "${RUNNER_TEMP}/input"
          gh release download share-source-handoff-20261103 --repo liuruojiang/microcap --pattern share-source-public-input-20261103.zip --dir "${RUNNER_TEMP}/input"
          python -B -c 'from pathlib import Path; import hashlib; p=Path("operator/research_reports/20261103_share_source_handoff/share_source_handoff.py"); expected="a76eca68304703c5bb50a325cc48dc44e9ccb42cf93e7e83acf3d5dff2889f0b"; actual=hashlib.sha256(p.read_bytes()).hexdigest(); actual==expected or (_ for _ in ()).throw(RuntimeError("Operator byte identity changed"))'
      - name: Refresh only native share sources serially; no history, signal or mail
        run: |
          set -o pipefail
          python -B -u operator/research_reports/20261103_share_source_handoff/share_source_handoff.py run-cloud \
            --source-root source \
            --input-zip "${RUNNER_TEMP}/input/share-source-public-input-20261103.zip" \
            --input-sha256 9b4b8e402b892dcd84b47d2a6550eb27bc51957d03400b4b4bdb2446bd46e763 \
            --work-root "${RUNNER_TEMP}/native-share-source" \
            --output-zip "${RUNNER_TEMP}/share-source-output-20261103.zip" \
            --interval-seconds 3 \
            2>&1 | tee "${RUNNER_TEMP}/share-source-handoff.log"
      - name: Preserve isolated source result or failure evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: share-source-only-20261103-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/share-source-output-20261103.zip
            ${{ runner.temp }}/share-source-output-20261103.receipt.json
            ${{ runner.temp }}/share-source-handoff.log
          if-no-files-found: warn
          retention-days: 90
