name: Top100 Realtime Close Consistency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realtime_close_consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Shanghai
      QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore generated strategy cache
        uses: actions/cache@v5
        with:
          path: |
            outputs
            .microcap_index_cache
          key: top100-realtime-close-consistency-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            top100-realtime-close-consistency-${{ runner.os }}-
            top100-realtime-${{ runner.os }}-

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests akshare matplotlib

      - name: Validate required realtime data secret
        run: |
          if [ -z "${QVERIS_API_KEY}" ]; then
            echo "Missing required GitHub Secret: QVERIS_API_KEY"
            exit 1
          fi

      - name: Run realtime vs close consistency audit
        id: audit
        shell: bash
        run: |
          set +e
          python verify_top100_realtime_close_consistency.py 2>&1 | tee realtime_close_consistency_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: top100-realtime-close-consistency
          path: |
            realtime_close_consistency_result.txt
            outputs/top100_realtime_close_consistency_*.csv
            outputs/top100_realtime_close_consistency_*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Add audit result to job summary
        if: always()
        run: |
          {
            echo "## Top100 realtime vs close consistency"
            echo
            echo "- Script exit code: ${{ steps.audit.outputs.exit_code }}"
            echo "- Artifact: top100-realtime-close-consistency"
            echo
            echo '```text'
            cat realtime_close_consistency_result.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail job when audit failed
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
