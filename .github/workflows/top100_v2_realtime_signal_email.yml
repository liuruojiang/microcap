name: Top100 v2 Realtime Signal Email

on:
  schedule:
    # 15:10 Asia/Shanghai == 07:10 UTC. A-share close is already available for realtime quote feeds.
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realtime_signal_email:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
      LC_ALL: C.UTF-8
      LANG: C.UTF-8

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore generated strategy cache
        uses: actions/cache@v5
        with:
          path: |
            outputs
            .microcap_index_cache
            .microcap_ohlc_cache
          key: top100-v2-realtime-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            top100-v2-realtime-${{ runner.os }}-
            top100-realtime-close-consistency-${{ runner.os }}-
            v76-level8-advisory-${{ runner.os }}-

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests akshare matplotlib

      - name: Run Top100 v2.0 realtime signal
        id: signal
        shell: bash
        run: |
          set +e
          timeout --foreground 30m python -u microcap_top100_mom16_biweekly_live_v2_0.py "实时信号" 2>&1 | tee realtime_signal_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload realtime signal outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: top100-v2-realtime-signal
          path: |
            realtime_signal_result.txt
            outputs/microcap_top100_mom16_biweekly_live_v2_0_realtime_signal.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Email realtime signal result
        id: email
        if: always()
        env:
          SIGNAL_EXIT_CODE: ${{ steps.signal.outputs.exit_code }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_USE_SSL: ${{ secrets.MAIL_USE_SSL }}
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import mimetypes
          import os
          import pathlib
          import smtplib
          import ssl
          from email.message import EmailMessage

          required = [
              "MAIL_SERVER",
              "MAIL_PORT",
              "MAIL_USERNAME",
              "MAIL_PASSWORD",
              "MAIL_TO",
              "MAIL_FROM",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print("email_sent=false")
              print("missing_mail_secrets=" + ",".join(missing))
              pathlib.Path("email_status.txt").write_text(
                  "email_sent=false\nmissing_mail_secrets=" + ",".join(missing) + "\n",
                  encoding="utf-8",
              )
              raise SystemExit(2)

          result_path = pathlib.Path("realtime_signal_result.txt")
          body = result_path.read_text(encoding="utf-8", errors="replace") if result_path.exists() else ""
          exit_code = os.environ.get("SIGNAL_EXIT_CODE") or "unknown"
          prefix = "SUCCESS" if exit_code == "0" else "FAILURE"
          subject = f"[{prefix}] Top100 v2.0 realtime signal run {os.environ.get('GITHUB_RUN_NUMBER', '')}".strip()

          message = EmailMessage()
          message["Subject"] = subject
          message["From"] = os.environ["MAIL_FROM"]
          message["To"] = os.environ["MAIL_TO"]
          message.set_content(body or f"Top100 v2.0 realtime signal exit_code={exit_code}")

          attachment_paths = [
              result_path,
              pathlib.Path("outputs/microcap_top100_mom16_biweekly_live_v2_0_realtime_signal.csv"),
          ]
          for path in attachment_paths:
              if not path.exists() or not path.is_file():
                  continue
              ctype, _ = mimetypes.guess_type(path.name)
              maintype, subtype = (ctype or "application/octet-stream").split("/", 1)
              message.add_attachment(
                  path.read_bytes(),
                  maintype=maintype,
                  subtype=subtype,
                  filename=path.name,
              )

          server = os.environ["MAIL_SERVER"]
          port = int(os.environ["MAIL_PORT"])
          use_ssl = os.environ.get("MAIL_USE_SSL", "").strip().lower() in {"1", "true", "yes"} or port == 465
          context = ssl.create_default_context()
          if use_ssl:
              with smtplib.SMTP_SSL(server, port, context=context, timeout=30) as smtp:
                  smtp.login(os.environ["MAIL_USERNAME"], os.environ["MAIL_PASSWORD"])
                  smtp.send_message(message)
          else:
              with smtplib.SMTP(server, port, timeout=30) as smtp:
                  smtp.starttls(context=context)
                  smtp.login(os.environ["MAIL_USERNAME"], os.environ["MAIL_PASSWORD"])
                  smtp.send_message(message)
          print("email_sent=true")
          pathlib.Path("email_status.txt").write_text("email_sent=true\n", encoding="utf-8")
          PY
          status=$?
          if [ -f email_status.txt ]; then
            cat email_status.txt >> "${GITHUB_OUTPUT}"
          fi
          exit "${status}"

      - name: Add realtime email result to job summary
        if: always()
        run: |
          {
            echo "## Top100 v2.0 realtime signal"
            echo
            echo "- Signal exit code: ${{ steps.signal.outputs.exit_code }}"
            echo "- Email sent: ${{ steps.email.outputs.email_sent }}"
            if [ -n "${{ steps.email.outputs.missing_mail_secrets }}" ]; then
              echo "- Missing mail secrets: ${{ steps.email.outputs.missing_mail_secrets }}"
            fi
            echo "- Artifact: top100-v2-realtime-signal"
            echo
            echo '```text'
            cat realtime_signal_result.txt || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail job when realtime signal failed
        if: steps.signal.outputs.exit_code != '0'
        run: exit 1
