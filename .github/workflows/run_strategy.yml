name: Run Microcap Strategy

on:
  schedule:
    - cron: '40 6 * * 1-5'  # Run every weekday at 06:40 UTC
  workflow_dispatch:  # Allow manual triggering

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib
      
      - name: Run strategy
        run: python microcap_top100_mom16_biweekly_live_v1_4.py "信号"
      
      - name: Upload results
        if: always()  # Ensures results are saved even if script fails
        uses: actions/upload-artifact@v3
        with:
          name: strategy-outputs
          path: outputs/
          retention-days: 30