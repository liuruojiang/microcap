name: Run Microcap Strategy

on:
  schedule:
    - cron: '40 6 * * 1-5'
  workflow_dispatch:

jobs:
  run_strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib
      
      - name: Run strategy
        run: python microcap_top100_mom16_biweekly_live_v1_4.py 信号
      
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-outputs
          path: outputs/
          retention-days: 30