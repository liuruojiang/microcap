name: Top100 Realtime Signals

on:
  schedule:
    # 14:45 Asia/Shanghai == 06:45 UTC.
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realtime_signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore generated strategy cache
        uses: actions/cache@v4
        with:
          path: |
            outputs
            .microcap_index_cache
          key: top100-realtime-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            top100-realtime-${{ runner.os }}-

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests akshare matplotlib

      - name: Validate required realtime data secret
        run: |
          if [ -z "${QVERIS_API_KEY}" ]; then
            echo "Missing required GitHub Secret: QVERIS_API_KEY"
            exit 1
          fi

      - name: Run v1.6 and v1.8 realtime signals
        id: signals
        shell: bash
        run: |
          set +e
          python run_top100_v1_6_v1_8_realtime_signals.py 2>&1 | tee realtime_signal_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload signal outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top100-realtime-signal-outputs
          path: |
            realtime_signal_result.txt
            outputs/*_realtime_signal.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Add realtime signal result to job summary
        if: always()
        run: |
          {
            echo "## Top100 v1.6/v1.8 realtime signals"
            echo
            echo "- Script exit code: ${{ steps.signals.outputs.exit_code }}"
            echo "- Artifact: top100-realtime-signal-outputs"
            echo
            echo '```text'
            cat realtime_signal_result.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail job when realtime signal script failed
        if: steps.signals.outputs.exit_code != '0'
        run: exit 1
