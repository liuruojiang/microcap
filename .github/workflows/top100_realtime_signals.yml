name: Top100 Realtime Signals

on:
  schedule:
    # 12:45 Asia/Shanghai == 04:45 UTC.
    - cron: '45 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realtime_signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore generated strategy cache
        uses: actions/cache@v5
        with:
          path: |
            outputs
            .microcap_index_cache
            .microcap_ohlc_cache
          key: top100-realtime-anchor-refresh-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            top100-realtime-anchor-refresh-v1-${{ runner.os }}-

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests akshare matplotlib

      - name: Validate required realtime data secret
        run: |
          if [ -z "${QVERIS_API_KEY}" ]; then
            echo "Missing required GitHub Secret: QVERIS_API_KEY"
            exit 1
          fi

      - name: Clear stale realtime outputs
        run: |
          mkdir -p outputs
          rm -f realtime_signal_result.txt outputs/*_realtime_signal.csv

      - name: Run v1.4, v1.6 and v1.8 realtime signals
        id: signals
        shell: bash
        run: |
          set +e
          {
            echo "### v1.4"
            python microcap_top100_mom16_biweekly_live_v1_4.py "实时信号"
            v14_status=$?
            echo
            echo "### v1.6/v1.8"
            python run_top100_v1_6_v1_8_realtime_signals.py
            v16_v18_status=$?
            if [ "${v14_status}" -ne 0 ] || [ "${v16_v18_status}" -ne 0 ]; then
              exit 1
            fi
          } 2>&1 | tee realtime_signal_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload signal outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: top100-realtime-signal-outputs
          path: |
            realtime_signal_result.txt
            outputs/*_realtime_signal.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Add realtime signal result to job summary
        if: always()
        run: |
          {
            echo "## Top100 v1.4/v1.6/v1.8 realtime signals"
            echo
            echo "- Script exit code: ${{ steps.signals.outputs.exit_code }}"
            echo "- Artifact: top100-realtime-signal-outputs"
            echo
            echo '```text'
            cat realtime_signal_result.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail job when realtime signal script failed
        if: steps.signals.outputs.exit_code != '0'
        run: exit 1
