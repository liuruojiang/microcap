name: Top100 Realtime Signals

on:
  schedule:
    # 14:45 Asia/Shanghai == 06:45 UTC.
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realtime_signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests akshare matplotlib

      - name: Validate required realtime data secret
        run: |
          if [ -z "${QVERIS_API_KEY}" ]; then
            echo "Missing required GitHub Secret: QVERIS_API_KEY"
            exit 1
          fi

      - name: Run v1.6 and v1.8 realtime signals
        id: signals
        shell: bash
        run: |
          set +e
          python run_top100_v1_6_v1_8_realtime_signals.py 2>&1 | tee realtime_signal_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload signal outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top100-realtime-signal-outputs
          path: |
            realtime_signal_result.txt
            outputs/*_realtime_signal.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Email realtime signal result
        if: always()
        env:
          SIGNAL_EXIT_CODE: ${{ steps.signals.outputs.exit_code }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_USE_SSL: ${{ secrets.MAIL_USE_SSL }}
        run: |
          python - <<'PY'
          import mimetypes
          import os
          import pathlib
          import smtplib
          import ssl
          from email.message import EmailMessage

          required = [
              "MAIL_SERVER",
              "MAIL_PORT",
              "MAIL_USERNAME",
              "MAIL_PASSWORD",
              "MAIL_TO",
              "MAIL_FROM",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing required GitHub Secrets: " + ", ".join(missing))

          result_path = pathlib.Path("realtime_signal_result.txt")
          body = result_path.read_text(encoding="utf-8", errors="replace") if result_path.exists() else ""
          exit_code = os.environ.get("SIGNAL_EXIT_CODE") or "unknown"
          prefix = "SUCCESS" if exit_code == "0" else "FAILURE"
          subject = f"[{prefix}] Top100 v1.6/v1.8 realtime signals run {os.environ.get('GITHUB_RUN_NUMBER', '')}".strip()

          message = EmailMessage()
          message["Subject"] = subject
          message["From"] = os.environ["MAIL_FROM"]
          message["To"] = os.environ["MAIL_TO"]
          message.set_content(body or f"Realtime signal script exit_code={exit_code}")

          attachment_paths = [result_path, *sorted(pathlib.Path("outputs").glob("*_realtime_signal.csv"))]
          for path in attachment_paths:
              if not path.exists() or not path.is_file():
                  continue
              ctype, _ = mimetypes.guess_type(path.name)
              maintype, subtype = (ctype or "application/octet-stream").split("/", 1)
              message.add_attachment(
                  path.read_bytes(),
                  maintype=maintype,
                  subtype=subtype,
                  filename=path.name,
              )

          server = os.environ["MAIL_SERVER"]
          port = int(os.environ["MAIL_PORT"])
          use_ssl = os.environ.get("MAIL_USE_SSL", "").strip().lower() in {"1", "true", "yes"} or port == 465
          context = ssl.create_default_context()
          if use_ssl:
              with smtplib.SMTP_SSL(server, port, context=context, timeout=30) as smtp:
                  smtp.login(os.environ["MAIL_USERNAME"], os.environ["MAIL_PASSWORD"])
                  smtp.send_message(message)
          else:
              with smtplib.SMTP(server, port, timeout=30) as smtp:
                  smtp.starttls(context=context)
                  smtp.login(os.environ["MAIL_USERNAME"], os.environ["MAIL_PASSWORD"])
                  smtp.send_message(message)
          PY

      - name: Fail job when realtime signal script failed
        if: steps.signals.outputs.exit_code != '0'
        run: exit 1
