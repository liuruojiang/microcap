prompt = "这是微盘股与 IC/IM 的独立每日研究信号任务。任务每个工作日北京时间 14:15 启动，尽早完成数据准备并在有效窗口内给出来源可审计的两组结果；不接交易接口，不生成下单指令。\n\n运行位置为 D:\\动量策略\\IC和IM滚动套利。开始后先读取本仓库 AGENTS.md、notes/mainline_registry.md、docs/ic_im_mainline_v1_4_r1_spec.md、docs/ic_im_v1_4_github_gmail_runbook.md，以及 D:\\动量策略\\微盘股对冲策略\\AGENTS.md 和该仓库正式 v2.0/v2.3/v2.5 入口说明。必须读取并更新 D:\\Codex\\home\\automations\\ic-im\\memory.md；避免重复已完成的重建或全量测试。\n\n启动时先通过 IC/IM 正式交易日历核验北京时间当天是否交易日（不运行信号、不联网刷新状态）。经日历确认的周末或交易所休市日，正常返回“休市，未生成实时信号”，写入 memory 后结束，不按缺少当日报价报错，不补证明、不改账本；日历覆盖无法确认时才明确 BLOCKED。下一交易日必须动态查询，不硬编码日期。\n\n保存的调度为工作日 14:15；启动后立即预检，并尽早并行准备官方源码与隔离测试、整理当日所需数据；只有通过门禁且具备合格当日快照后才能发布盘中研究信号：\n1. IC/IM：只使用按信号日生效的 v1.4-r1 正式研究信号路径；2026-10-08 起按文末 fix11 条款执行，此前保持对应历史身份。校验 runtime/ic_im_v1_4_r1 的 migration_record.json、完整 SHA-256 哈希链、strategy_revision=r1、schema_version=4、verified_day 和最近已完成交易日；仅通过 run_ic_im_v1_4_github_digest.py / poe_ic_im_v1_4_server.py 续接。若本地尚无 v1.4 账本，只能从已验证 runtime/ic_im_v1_3_r7 账本运行 migrate_ic_im_v1_3_r7_to_v1_4_r1_state.py 建立独立 v1.4 续接链，保持全部锚点不变；不得复制、手改、重置旧账本或静默新建部署账本。设置 ICIM_STATE_DIR 指向 runtime/ic_im_v1_4_r1，部署路径启用 ICIM_REQUIRE_MIGRATION=1。漏掉的历史交易日必须走历史回放；盘中快照绝不写账本。\n2. 微盘股：先用 IC/IM 正式交易日历函数 `_latest_completed_exchange_day` 与当前北京时间取得上一已完成交易日；在 D:\\动量策略\\微盘股对冲策略运行 `python -X utf8 scripts\\top100_cloud_delivery.py sync --expected-date YYYY-MM-DD`（YYYY-MM-DD 必须取上述正式日历结果，不能取旧文件末日）。优先复用已通过三版本整体清单的本地同日状态；否则仅恢复 GitHub main 成功日报运行的 `microcap-whole-delivery-state` 工件，必须先临时目录整包/代码/日期/哈希验证并备份，拒绝覆盖更新本地状态、拒绝与整组刷新并发。sync 不重建，不放宽 ST，不把旧证明改成今日；无合格工件就独立 BLOCKED，不在盘中全量刷新。然后在 D:\\动量策略\\微盘股对冲策略运行 `python -X utf8 scripts\\realtime_state_bundle.py preflight --max-anchor-age-days 5 --expected-date YYYY-MM-DD`：仅通过带备用源的正式指数历史预检独立核验最近已完成交易日，与已持久化面板、代理、成本净值和成员/ST检查一致且状态哈希未变化后生成当天证明；不调用 refresh_state、不重建或改写面板/NAV。随后运行 `python -X utf8 scripts\\realtime_state_bundle.py validate --max-anchor-age-days 5`，validate 仍是只读状态校验。 preflight 与 validate 通过后再运行 `python -X utf8 scripts\\top100_delivery.py check`，确认 v2.0/v2.3/v2.5 的全部最终产物、当前源代码和已批准 authority 与完整清单一致，不能用 base_state_only 代替整体通过。验证必须确认上一已完成交易日锚点、面板/代理/成本净值、当前刷新证明及有效成员/ST 状态一致；失败即记录 BLOCKED，14:20 至 14:47 禁止用策略入口触发重建。\n3. 不在定时任务里跑完整 pytest。交易日确认后、任何生产状态恢复/证明/续账之前，先分别执行限时 60 秒的离线交付专项回归：微盘在其正式目录运行 python -X utf8 -m pytest -q tests/test_realtime_preflight.py tests/test_top100_delivery.py tests/test_top100_cloud_delivery.py tests/test_adversarial_microcap_delivery.py tests/test_realtime_exchange_calendar.py tests/test_exchange_calendar_provider.py tests/test_script_delivery_adversarial.py；IC/IM 在其正式目录运行 python -B -X utf8 -m pytest -q -p no:cacheprovider test_delivery_transport_retry.py test_ohlcv_provider_validation.py test_ic_im_v1_4_policy.py test_poe_ic_im_v1_4_state.py test_migrate_ic_im_v1_3_r7_to_v1_4_r1_state.py test_ic_im_v1_4_integration_guards.py test_run_ic_im_v1_4_github_digest.py test_adversarial_icim_delivery.py test_im_put_policy.py test_adversarial_im_put_execution_20260908.py test_adversarial_im_ledger_20260908.py test_adversarial_im_report_iv_20260908.py test_im_put_price_basis.py test_live_mo_put_midpoint_20260908.py test_grid_half_release_20260913.py test_im_grid160_half_release_20260914.py test_ic_im_v1_4_ic_csi500_forward.py test_adversarial_market_20261007.py test_adversarial_state_20261007.py test_adversarial_delivery_20261007.py test_adversarial_policy_20261007.py。ICIM_STATE_DIR 仅在测试子进程内指向新建临时测试目录，绝不可指向生产账本；测试子进程的环境副本必须显式设置 ICIM_REQUIRE_MIGRATION=0，避免继承生产开关导致空测试目录导入失败；正式 runner 必须恢复 ICIM_REQUIRE_MIGRATION=1 并使用原生产状态路径。测试与数据样本缺失、失败或超时，只 BLOCKED 对应策略并保存日志，不影响另一条通过的策略；不在盘中自动升级依赖、不跳过失败测试。上述是交付专项测试，不是历史重建或全仓测试。通过后继续原有状态、来源和覆盖率检查。\n\n两族专项与各自生产状态门禁通过后，立即分别运行两条正式研究信号路径；盘中资格仍以真实快照早于北京时间 15:00:00 为准：\n- 微盘股：仅当上述 state-only 验证通过时，先设置 `TOP100_REALTIME_REQUIRE_STATE=1`，按生产默认 v2.0 再 v2.3、v2.5 串行运行官方 `实时信号` 入口。禁止并发运行，禁止清除该环境变量，禁止触发 refresh_state；任一版本未产生当日 CSV 或不满足 100/100 当日报价、成员 100 唯一、ST 交集为零即独立 BLOCKED。报告 signal_day、数据锚点、报价覆盖、当前/目标仓位、动作、scale、Top100 完整性和 ST 交集。\n- IC/IM：使用 v1.4-r1 按信号日选择的正式 runner 与独立持久账本，必须同时取得 IC、IM 当天完整行情。报告 build、strategy_revision、state_anchor_day、market_date、next_trade_date、当前/目标期货单位、动量袖变化、IC 基础 NAV 回撤与 6% 防守状态、IM Volume/MA160 与极热门禁、Put/Call 动作及数据源。IC 明确禁止 Call；IM 自 2026-09-26 信号日起禁止新开和救援卖 Call，旧模型仓位仅显示买回目标。\n\n故障处理：两条策略独立成败，任何一条失败不得遮蔽另一条有效结果。只重试被阻塞的组件，计划在 14:35、14:40、14:45、14:50、14:55 各最多一次，15:00:00 硬截止；已成功的数据重步骤不得重复。每次重试前重新检查阻塞来源的日期和覆盖，不得用旧目标冒充当天信号，不得用代理、v1.2、v1.3 或其他研究候选替代 v1.4-r1。若仍失败，返回明确 BLOCKED 或部分成功结果，写清根因、最后成功锚点和下一步。\n\n最终输出先给简明汇总表，再分别列微盘股与 IC/IM 细节，并附实际开始时间、各尝试时间、命令耗时、退出码、build/version、数据日期、来源、账本 sequence 与 digest。只有在信号日和执行日语义成立时才写动作；非信号日目标差异标为参考。把本次结果、运行时间和未解决阻塞简要写入 automation memory。\n\nIC/IM 新增固定展示要求：IM 为严格季度 T-1 收盘展期，IC 为严格季度 T-3 收盘展期；T 按实际交易日倒推，期权维护仍独立。列出当前期货、下一季合约、计划换仓日及是否只是预告，禁止把提前预告写成已完成换仓。每日分别报告 quarter_spread：最近尚未到期挂牌季月与相邻下一季月的两腿合约、价格、近季减远季点数、百分比、按到期间隔折算年化、行情日和来源。正值表示远季相对折价，年化仅为尺度换算而非保证收益。盘中标记同一报价快照；缺腿或错日显示 N/A 及原因，不混用旧价格、不改用非相邻月份。到期后合约对切换须明确提示。r6 历史绩效仅为旧版参考，不能冒称 r7 新规则的绩效。微盘股部分及原调度、重试、故障隔离要求不变。\n\nIC/IM 交付加固：使用 delivery_revision=20260904-crossday-transport-2 或已验证后续修订，官方 runner 加 --expected-market-date 当天北京时间日期；连接/超时仅重试失败品种一次，数据错日/不完整继续失败关闭。OHLCV 每个数据源都必须通过同一完整校验后才能被选中，主源过期可尝试备用源但不可拼接旧数据。失败时保留 result.json 和 diagnostic_report.md，禁止把成功发送异常邮件等同正常日报成功。\n\n2026-09-04 对抗验收补充：上述离线测试第3项必须实际先于第1/2项任何生产状态操作。运行开始若已超过14:47，不追补盘中信号，明确本次窗口错过；已成功策略不重复执行。微盘preflight的expected-date与sync必须使用同一个正式日历所得上一已完成交易日，不能硬编码或从缓存推断。2026-09-04 已获用户授权并发布实时日历新鲜度 v1：实时锚点必须严格等于独立正式交易日历计算的上一已完成 session；长假自然日间隔本身不得阻断。使用已验证包含独立日历模块及全部实时回退修复的核心（5b728c41 或经验证后续版本），读取 docs/realtime_calendar_freshness_v1_20260904.md。仍保留当天快照、完整100/100报价、ST/成员、状态证明和缺交易日硬拦截；独立日历缺失/不覆盖/超时明确 BLOCKED，不能拿截断NAV推定休市、不能扩大陈旧容忍、不能重复重建。整组交付的独立目标日期也必须使用独立交易日历，不为纯日期核验重复请求指数价格历史；实际价格/状态/最终数据流验证仍保留。历史新鲜度和策略计算不变。保留信号日与下一实际执行日，合法次日再平衡计划不冒充今天成交。\n\n本地Codex输出与GitHub Gmail交付分开验收：本地生成日报不等于已发Gmail，不另行调用SMTP补发。GitHub若有发送intent却无完成marker，属于发送状态不确定，必须核对原run与Gmail后经明确correction处理，禁止自动重发或删除intent。所有新专项测试必须保留，缺依赖按本策略BLOCKED且不盘中安装。\n\n2026-09-04 v2.0/v2.3 朴素版多智能体对抗修复验收：保持本地每日14:30、14:47截止和IC/IM全部既有规则不变。微盘第3项60秒离线专项在原6个文件后加入 tests/test_adversarial_v20_plain_2026090